runtime: nodejs20
service: frontend-123230039

handlers:
  # Ini buat nanganin file statis kayak CSS, JS, Gambar
  - url: /
    static_files: build/\1
    upload: build/(.*\..+)$

  # Ini buat nanganin rute React supaya nggak error 404
  - url: /.*
    static_files: build/index.html
    upload: build/index.html

# Tambahkan ini supaya hemat (untuk testing)
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 1