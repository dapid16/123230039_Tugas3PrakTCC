steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/notes-fe", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/notes-fe"]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "notes-frontend",
        "--image",
        "gcr.io/$PROJECT_ID/notes-fe",
        "--region",
        "asia-southeast2",
        "--allow-unauthenticated"
      ]
options:
  logging: CLOUD_LOGGING_ONLY