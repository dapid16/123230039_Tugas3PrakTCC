steps:
  # Membuat image dengan perintah "cloud build -t gcr.io/$PROJECT_ID/notes-be ."
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/notes-be", "."]

  # Meng-upload/push image yg telah dibuat ke Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/notes-be"]

  # Melakukan deploy ke cloud run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "notes-backend",
        "--image",
        "gcr.io/$PROJECT_ID/notes-be",
        "--timeout",
        "1000s",
        "--port",
        "3000",
        "--region",
        "asia-southeast2", # Region Jakarta. Ubah ke us-central1 kalau dosen mewajibkan
        "--allow-unauthenticated",
      ]

options:
  logging: CLOUD_LOGGING_ONLY